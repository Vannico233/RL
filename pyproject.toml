[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-active-vision-rl"
version = "0.1.0"
description = "Auditable active visual observation for ChartQA reinforcement learning"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4,<13"]

[project.scripts]
chart-rl = "chart_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
